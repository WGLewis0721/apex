project_id = "apex"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "https://wglewis0721.github.io/apex/"
additional_redirect_urls = ["https://wglewis0721.github.io/apex/", "https://wglewis0721.github.io/apex/**", "http://localhost:5173", "http://localhost:5173/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
# Hosted production keeps email confirmation enabled. Local development can
# still use the project's normal Supabase auth settings; signup code always
# supplies an explicit redirect URL for the current app origin.
enable_confirmations = false

[functions.apex-checkout]
verify_jwt = true

[functions.apex-workspace]
verify_jwt = true

[functions.apex-stripe-webhook]
# Stripe signature verification is performed against the raw body in the handler.
verify_jwt = false
