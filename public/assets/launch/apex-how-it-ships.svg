"h" font-size="30">APEX CLOUD</text><g><rect x="710" y="370" width="300" height="48" rx="14" fill="#fff"/><circle cx="740" cy="394" r="8" fill="#0B8A6A"/><text x="760" y="401" class="navy h" font-size="18">Commercial state</text><rect x="710" y="438" width="300" height="48" rx="14" fill="#fff"/><circle cx="740" cy="462" r="8" fill="#B45C3D"/><text x="760" y="469" class="navy h" font-size="18">Usage + credits</text><rect x="710" y="506" width="300" height="48" rx="14" fill="#fff"/><circle cx="740" cy="530" r="8" fill="#B45C3D"/><text x="760" y="537" class="navy h" font-size="18">Entitlements + limits</text><rect x="710" y="574" width="300" height="48" rx="14" fill="#fff"/><circle cx="740" cy="598" r="8" fill="#0A73D9"/><text x="760" y="605" class="navy h" font-size="18">Billing sync</text><rect x="710" y="642" width="300" height="48" rx="14" fill="#fff"/><circle cx="740" cy="666" r="8" fill="#0B8A6A"/><text x="760" y="673" class="navy h" font-size="18">API + webhooks</text></g><text x="860" y="720" text-anchor="middle" fill="#D4DEEA" font-size="18">You host and operate this.</text><rect class="card" x="1210" y="335" width="300" height="300" rx="28"/><text x="1360" y="390" text-anchor="middle" class="navy h" font-size="24">PAYMENT PROVIDER</text><rect x="1260" y="435" width="200" height="70" rx="18" fill="#EAF3FB"/><text x="1360" y="478" text-anchor="middle" fill="#0A73D9" class="h" font-size="24">Stripe</text><text x="1360" y="545" text-anchor="middle" class="muted" font-size="18">Moves the money</text><text x="1360" y="575" text-anchor="middle" class="muted" font-size="18">Sends billing events</text><g fill="none" stroke-width="5" stroke-linecap="round"><path d="M515 505h120m-14-9l14 9-14 9" stroke="#0B8A6A"/><path d="M1080 505h115m-14-9l14 9-14 9" stroke="#0A73D9"/></g><text x="575" y="480" text-anchor="middle" class="muted" font-size="16">API</text><text x="1140" y="480" text-anchor="middle" class="muted" font-size="16">webhooks</text><text x="800" y="835" text-anchor="middle" class="navy h" font-size="25">Website → subscription → API key → npm install → connect Stripe → test → live</text></svg>