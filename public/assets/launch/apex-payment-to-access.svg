<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B8A6A"/><stop offset=".5" stop-color="#0A73D9"/><stop offset="1" stop-color="#B45C3D"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.navy{fill:#10233F}.muted{fill:#667085}.h{font-weight:800}.card{fill:#fff;stroke:#D9E0E8;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#F7F8FA"/><path d="M80 105l34-38 34 38h-12l-22-24-22 24z" fill="url(#brand)"/><text x="164" y="98" class="navy h" font-size="30">APEX</text><text x="80" y="178" class="navy h" font-size="54">The moment APEX earns its keep</text><text x="80" y="220" class="muted" font-size="24">The payment is only the beginning. APEX turns it into product behavior.</text><rect x="1250" y="68" width="270" height="44" rx="22" fill="#10233F"/><text x="1385" y="97" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">PAYMENT → ACCESS</text><g><rect class="card" x="90" y="330" width="240" height="230" rx="26"/><circle cx="210" cy="385" r="26" fill="#0A73D9"/><text x="210" y="392" text-anchor="middle" fill="#fff" class="h" font-size="20">1</text><text x="210" y="455" text-anchor="middle" class="navy h" font-size="23">Customer buys Pro</text><text x="210" y="500" text-anchor="middle" class="muted" font-size="18">$79 / month</text></g><g><rect class="card" x="385" y="330" width="240" height="230" rx="26"/><circle cx="505" cy="385" r="26" fill="#0B8A6A"/><text x="505" y="392" text-anchor="middle" fill="#fff" class="h" font-size="20">2</text><text x="505" y="455" text-anchor="middle" class="navy h" font-size="23">Stripe says paid</text><text x="505" y="500" text-anchor="middle" class="muted" font-size="18">Payment succeeded</text></g><g><rect class="card" x="680" y="330" width="240" height="230" rx="26"/><circle cx="800" cy="385" r="26" fill="#B45C3D"/><text x="800" y="392" text-anchor="middle" fill="#fff" class="h" font-size="20">3</text><text x="800" y="455" text-anchor="middle" class="navy h" font-size="23">APEX updates rights</text><text x="800" y="500" text-anchor="middle" class="muted" font-size="18">5,000 credits + Pro</text></g><g><rect class="card" x="975" y="330" width="240" height="230" rx="26"/><circle cx="1095" cy="385" r="26" fill="#B45C3D"/><text x="1095" y="392" text-anchor="middle" fill="#fff" class="h" font-size="20">4</text><text x="1095" y="455" text-anchor="middle" class="navy h" font-size="23">Customer uses app</text><text x="1095" y="500" text-anchor="middle" class="muted" font-size="18">250 credits consumed</text></g><g><rect class="card" x="1270" y="330" width="240" height="230" rx="26"/><circle cx="1390" cy="385" r="26" fill="#0B8A6A"/><text x="1390" y="392" text-anchor="middle" fill="#fff" class="h" font-size="20">5</text><text x="1390" y="455" text-anchor="middle" class="navy h" font-size="23">APEX enforces</text><text x="1390" y="500" text-anchor="middle" class="muted" font-size="18">Allow / warn / block</text></g><g stroke-width="4" fill="none" stroke-linecap="round"><path d="M335 445h45m-12-8l12 8-12 8" stroke="#0A73D9"/><path d="M630 445h45m-12-8l12 8-12 8" stroke="#0B8A6A"/><path d="M925 445h45m-12-8l12 8-12 8" stroke="#B45C3D"/><path d="M1220 445h45m-12-8l12 8-12 8" stroke="#B45C3D"/></g><rect x="140" y="650" width="1320" height="120" rx="30" fill="#10233F"/><text x="800" y="700" text-anchor="middle" fill="#fff" class="h" font-size="31">Stripe answers: “Did they pay?”</text><text x="800" y="745" text-anchor="middle" fill="#D7E4F0" class="h" font-size="26">APEX answers: “What should the app let them do now?”</text></svg>