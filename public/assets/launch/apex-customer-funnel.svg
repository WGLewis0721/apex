<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900"><defs><linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B8A6A"/><stop offset=".5" stop-color="#0A73D9"/><stop offset="1" stop-color="#B45C3D"/></linearGradient><style>text{font-family:Arial,Helvetica,sans-serif}.navy{fill:#10233F}.muted{fill:#667085}.h{font-weight:800}.card{fill:#fff;stroke:#D9E0E8;stroke-width:2}</style></defs><rect width="1600" height="900" fill="#F7F8FA"/><path d="M80 105l34-38 34 38h-12l-22-24-22 24z" fill="url(#brand)"/><text x="164" y="98" class="navy h" font-size="30">APEX</text><text x="80" y="178" class="navy h" font-size="54">From “this looks useful” to live in your app</text><text x="80" y="220" class="muted" font-size="24">APEX should feel like buying a subscription, not hiring a consulting firm.</text><rect x="1270" y="68" width="250" height="44" rx="22" fill="#10233F"/><text x="1395" y="97" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">CUSTOMER FUNNEL</text><g><rect class="card" x="80" y="330" width="220" height="290" rx="26"/><circle cx="120" cy="375" r="24" fill="#0B8A6A"/><text x="120" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">1</text><text x="105" y="445" class="navy h" font-size="26">See APEX</text><text x="105" y="490" class="muted" font-size="19">Understand the promise</text><text x="105" y="525" class="muted" font-size="19">Payment → access → usage</text></g><g><rect class="card" x="330" y="330" width="220" height="290" rx="26"/><circle cx="370" cy="375" r="24" fill="#0A73D9"/><text x="370" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">2</text><text x="355" y="445" class="navy h" font-size="26">Choose a plan</text><text x="355" y="490" class="muted" font-size="19">Launch / Growth</text><text x="355" y="525" class="muted" font-size="19">Clear monthly price</text></g><g><rect class="card" x="580" y="330" width="220" height="290" rx="26"/><circle cx="620" cy="375" r="24" fill="#B45C3D"/><text x="620" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">3</text><text x="605" y="445" class="navy h" font-size="26">Pay</text><text x="605" y="490" class="muted" font-size="19">Stripe checkout</text><text x="605" y="525" class="muted" font-size="19">Card / Link / invoice</text></g><g><rect class="card" x="830" y="330" width="220" height="290" rx="26"/><circle cx="870" cy="375" r="24" fill="#0A73D9"/><text x="870" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">4</text><text x="855" y="445" class="navy h" font-size="26">Create workspace</text><text x="855" y="490" class="muted" font-size="19">Get API keys</text><text x="855" y="525" class="muted" font-size="19">Sandbox first</text></g><g><rect class="card" x="1080" y="330" width="220" height="290" rx="26"/><circle cx="1120" cy="375" r="24" fill="#0B8A6A"/><text x="1120" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">5</text><text x="1105" y="445" class="navy h" font-size="26">Connect + install</text><text x="1105" y="490" class="muted" font-size="19">Stripe + SDK</text><text x="1105" y="525" class="muted" font-size="19">Copy / paste setup</text></g><g><rect class="card" x="1330" y="330" width="190" height="290" rx="26"/><circle cx="1370" cy="375" r="24" fill="#B45C3D"/><text x="1370" y="382" text-anchor="middle" fill="#fff" class="h" font-size="20">6</text><text x="1355" y="445" class="navy h" font-size="26">Go live</text><text x="1355" y="490" class="muted" font-size="19">Test → Production</text><text x="1355" y="525" class="muted" font-size="19">APEX underneath</text></g><g stroke="#0A73D9" stroke-width="4" fill="none" stroke-linecap="round"><path d="M305 475h20m-10-8l10 8-10 8M555 475h20m-10-8l10 8-10 8M805 475h20m-10-8l10 8-10 8M1055 475h20m-10-8l10 8-10 8M1305 475h20m-10-8l10 8-10 8"/></g><rect x="80" y="680" width="1440" height="120" rx="30" fill="#10233F"/><text x="800" y="730" text-anchor="middle" fill="#fff" class="h" font-size="28">The sale ends with a working integration, not a PDF.</text><text x="800" y="772" text-anchor="middle" fill="#D4DEEA" font-size="21">Website sells it · Stripe gets APEX paid · npm/API delivers it · APEX Cloud runs it</text></svg>