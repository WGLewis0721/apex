id: com.graymatter.apex
name: APEX
version: 0.2.0
declarations:
  distribution_type: public
  sandbox_install_compatible: true
  stripe_api_access_type: oauth
  allowed_redirect_uris:
    - https://fnmxlmjrkgojowpzrcwa.supabase.co/functions/v1/apex-stripe-connect-callback
  stripe_api_access:
    permissions:
      - permission: connected_account_read
        purpose: Confirm which Stripe account is linked to this APEX workspace.
      - permission: event_read
        purpose: Receive and audit the Stripe events that keep APEX product state synchronized.
      - permission: payment_intent_read
        purpose: Turn successful configured payments into source-attributed APEX credit grants.
      - permission: charge_read
        purpose: Apply Stripe refunds to the originating APEX credit grant without affecting other purchases.
extensions: []
